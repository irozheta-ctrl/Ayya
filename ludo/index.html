<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SAVARI LUDO</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at top, #24103b, #080510 65%);
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .box {
            width: min(92%, 430px);
            padding: 28px 22px;
            border: 1px solid #a855f7;
            border-radius: 24px;
            background: rgba(17, 9, 28, .95);
            box-shadow:
                0 0 25px rgba(168, 85, 247, .25),
                inset 0 0 25px rgba(168, 85, 247, .05);
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 5px;
            color: #e879f9;
            text-shadow:
                0 0 8px #e879f9,
                0 0 20px #a855f7;
        }

        .subtitle {
            text-align: center;
            margin-top: 7px;
            color: #aaa;
            letter-spacing: 2px;
            font-size: 12px;
        }

        .room {
            margin: 24px 0 18px;
            padding: 13px;
            border-radius: 13px;
            background: #1b1028;
            color: #d8b4fe;
            text-align: center;
        }

        .room strong {
            color: #fff;
            letter-spacing: 2px;
        }

        .players-title {
            color: #c084fc;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .players {
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .player {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 13px;
            background: #160d22;
            border: 1px solid #2d1b3d;
        }

        .dot {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            box-shadow: 0 0 12px currentColor;
            flex-shrink: 0;
        }

        .player-name {
            flex: 1;
            font-weight: bold;
        }

        .you {
            color: #a78bfa;
            font-size: 11px;
        }

        .count {
            text-align: center;
            margin-top: 18px;
            color: #aaa;
        }

        .status {
            margin-top: 14px;
            text-align: center;
            color: #86efac;
            font-size: 13px;
        }

        .error {
            color: #fca5a5;
        }

        .empty {
            text-align: center;
            padding: 20px;
            color: #777;
        }
    </style>
</head>

<body>

<div class="box">

    <div class="logo">
        SAVARI
    </div>

    <div class="subtitle">
        MULTIPLAYER LUDO
    </div>

    <div class="room">
        ROOM:
        <strong id="roomId">---</strong>
    </div>

    <div class="players-title">
        👥 PLAYERS
    </div>

    <div id="players" class="players">
        <div class="empty">
            Menunggu pemain...
        </div>
    </div>

    <div id="count" class="count">
        0 / 4 PLAYERS
    </div>

    <div id="status" class="status">
        Menghubungkan...
    </div>

</div>

<script type="module" src="./game.js"></script>

</body>
</html>
