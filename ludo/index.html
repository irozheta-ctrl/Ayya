<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SAVARI LUDO</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at 50% 0%,
                    #321052 0%,
                    #12081d 42%,
                    #06040a 100%
                );
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            overflow-x: hidden;
        }

        .game {
            width: min(100%, 520px);
            padding: 14px;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            text-align: center;
            margin-bottom: 12px;
        }

        .logo {
            font-size: 27px;
            font-weight: 900;
            letter-spacing: 5px;
            color: #e879f9;
            text-shadow:
                0 0 7px #e879f9,
                0 0 18px #a855f7,
                0 0 35px #7e22ce;
        }

        .room {
            margin-top: 5px;
            font-size: 12px;
            color: #c4b5fd;
            letter-spacing: 2px;
        }

        /* =========================
           PLAYERS
        ========================= */

        .players {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 12px;
        }

        .player {
            padding: 8px 4px;
            text-align: center;
            border-radius: 12px;
            background: rgba(20, 10, 32, .9);
            border: 1px solid #332040;
            font-size: 10px;
            transition: .25s;
        }

        .player.active {
            border-color: #e879f9;
            box-shadow:
                0 0 10px rgba(232, 121, 249, .5);
        }

        .player-dot {
            width: 13px;
            height: 13px;
            margin: 0 auto 5px;
            border-radius: 50%;
            box-shadow: 0 0 10px currentColor;
        }

        .red {
            background: #ef4444;
            color: #ef4444;
        }

        .blue {
            background: #3b82f6;
            color: #3b82f6;
        }

        .green {
            background: #22c55e;
            color: #22c55e;
        }

        .yellow {
            background: #eab308;
            color: #eab308;
        }

        /* =========================
           BOARD
        ========================= */

        .board-wrap {
            width: 100%;
            aspect-ratio: 1 / 1;
            padding: 7px;
            border-radius: 22px;

            background: #160b22;

            border: 1px solid #a855f7;

            box-shadow:
                0 0 18px rgba(168, 85, 247, .35),
                inset 0 0 18px rgba(168, 85, 247, .08);
        }

        .board {
            width: 100%;
            height: 100%;

            display: grid;
            grid-template-columns: repeat(15, 1fr);
            grid-template-rows: repeat(15, 1fr);

            overflow: hidden;
            border-radius: 16px;

            background: #100918;
        }

        .cell {
            position: relative;

            border: 1px solid rgba(255,255,255,.06);

            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* =========================
           HOME AREAS
        ========================= */

        .home-red {
            grid-column: 1 / 7;
            grid-row: 1 / 7;

            background:
                radial-gradient(
                    circle,
                    rgba(239,68,68,.35),
                    rgba(80,10,20,.7)
                );

            position: relative;
        }

        .home-blue {
            grid-column: 10 / 16;
            grid-row: 1 / 7;

            background:
                radial-gradient(
                    circle,
                    rgba(59,130,246,.35),
                    rgba(10,20,70,.7)
                );

            position: relative;
        }

        .home-green {
            grid-column: 1 / 7;
            grid-row: 10 / 16;

            background:
                radial-gradient(
                    circle,
                    rgba(34,197,94,.35),
                    rgba(5,55,25,.7)
                );

            position: relative;
        }

        .home-yellow {
            grid-column: 10 / 16;
            grid-row: 10 / 16;

            background:
                radial-gradient(
                    circle,
                    rgba(234,179,8,.35),
                    rgba(65,45,5,.7)
                );

            position: relative;
        }

        .home-inner {
            position: absolute;

            width: 70%;
            height: 70%;

            left: 15%;
            top: 15%;

            border-radius: 18px;

            background: rgba(8,4,14,.85);

            border: 1px solid rgba(255,255,255,.1);

            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;

            gap: 10px;
            padding: 12px;
        }

        .home-slot {
            border-radius: 50%;

            border: 2px solid rgba(255,255,255,.15);

            box-shadow:
                inset 0 0 10px rgba(0,0,0,.5);
        }

        .home-slot.red {
            background: rgba(239,68,68,.55);
        }

        .home-slot.blue {
            background: rgba(59,130,246,.55);
        }

        .home-slot.green {
            background: rgba(34,197,94,.55);
        }

        .home-slot.yellow {
            background: rgba(234,179,8,.55);
        }

        /* =========================
           CENTER
        ========================= */

        .center {
            grid-column: 7 / 10;
            grid-row: 7 / 10;

            position: relative;

            background:
                conic-gradient(
                    #ef4444 0deg 90deg,
                    #3b82f6 90deg 180deg,
                    #eab308 180deg 270deg,
                    #22c55e 270deg 360deg
                );

            clip-path: polygon(
                0 0,
                100% 0,
                100% 100%,
                0 100%
            );

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .center-core {
            width: 52%;
            height: 52%;

            border-radius: 50%;

            background: #12091a;

            border: 2px solid #e879f9;

            box-shadow:
                0 0 15px #e879f9,
                inset 0 0 15px rgba(232,121,249,.25);

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 9px;
            font-weight: bold;
            letter-spacing: 1px;
            color: #f5d0fe;
        }

        /* =========================
           PATH
        ========================= */

        .path {
            background: #191020;
        }

        .path.red-path {
            background: rgba(239,68,68,.15);
        }

        .path.blue-path {
            background: rgba(59,130,246,.15);
        }

        .path.green-path {
            background: rgba(34,197,94,.15);
        }

        .path.yellow-path {
            background: rgba(234,179,8,.15);
        }

        /* =========================
           BIDAK
        ========================= */

        .piece {
            width: 62%;
            height: 62%;

            border-radius: 50%;

            position: relative;
            z-index: 5;

            border: 2px solid rgba(255,255,255,.65);

            box-shadow:
                0 0 8px currentColor,
                0 0 16px currentColor;

            animation: pulse 1.8s infinite;
        }

        .piece.red {
            background: #ef4444;
            color: #ef4444;
        }

        .piece.blue {
            background: #3b82f6;
            color: #3b82f6;
        }

        .piece.green {
            background: #22c55e;
            color: #22c55e;
        }

        .piece.yellow {
            background: #eab308;
            color: #eab308;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.08);
            }
        }

        /* =========================
           DICE AREA
        ========================= */

        .control {
            margin-top: 14px;

            padding: 14px;

            border-radius: 18px;

            background: rgba(17,9,28,.95);

            border: 1px solid #3b2250;

            text-align: center;
        }

        .turn {
            font-size: 12px;
            color: #c4b5fd;
            margin-bottom: 10px;
        }

        .dice {
            width: 64px;
            height: 64px;

            margin: 0 auto 12px;

            border-radius: 16px;

            background: #fff;

            color: #12091a;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 31px;
            font-weight: 900;

            box-shadow:
                0 0 15px rgba(255,255,255,.35);

            user-select: none;
        }

        .roll {
            width: 100%;

            padding: 13px;

            border: 0;

            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    #a855f7,
                    #e879f9
                );

            color: white;

            font-size: 14px;
            font-weight: 900;

            letter-spacing: 2px;

            cursor: pointer;

            box-shadow:
                0 0 15px rgba(168,85,247,.35);

            transition: .2s;
        }

        .roll:active {
            transform: scale(.97);
        }

        .roll:disabled {
            opacity: .4;
            cursor: not-allowed;
        }

        /* =========================
           STATUS
        ========================= */

        .status {
            margin-top: 10px;

            text-align: center;

            font-size: 11px;

            color: #86efac;
        }

        .error {
            color: #fca5a5;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 380px) {

            .game {
                padding: 9px;
            }

            .logo {
                font-size: 23px;
            }

            .players {
                gap: 4px;
            }

            .player {
                padding: 6px 2px;
                font-size: 9px;
            }

            .board-wrap {
                padding: 5px;
            }

            .control {
                padding: 11px;
            }

        }
    </style>
</head>

<body>

<div class="game">

    <!-- HEADER -->

        <div class="logo">
            SAVARI
        </div>

        <div class="room">
            MULTIPLAYER LUDO • ROOM

    </div>


    <!-- PLAYERS -->

        <div class="player active">

            <div class="player-dot red"></div>

            <div>

        <div class="player">

            <div class="player-dot blue"></div>

                🔵 Player 2

        </div>

        <div class="player">

        </div>

        <div class="player">

            <div class="player-dot yellow"></div>

    </div>


    <!-- BOARD -->

        <div class="board">

            <div class="home-red">

                <div class="home-inner">

            </div>


            <!-- BLUE HOME -->
            <div class="home-blue">

                <div class="home-inner">

                    <div class="home-slot blue"></div>
                    <div class="home-slot blue"></div>
                    <div class="home-slot blue"></div>
                    <div class="home-slot blue"></div>

                </div>

            </div>


            <!-- GREEN HOME -->
            <div class="home-green">

                <div class="home-inner">

                    <div class="home-slot green"></div>
                    <div class="home-slot green"></div>
                    <div class="home-slot green"></div>
                    <div class="home-slot green"></div>

                </div>

            </div>


            <!-- YELLOW HOME -->
            <div class="home-yellow">

                <div class="home-inner">

                    <div class="home-slot yellow"></div>
                    <div class="home-slot yellow"></div>

            <!-- PATH AREA -->
            <div class="cell path" style="grid-column:7;grid-row:1;"></div>

            <div class="cell path" style="grid-column:9;grid-row:1;"></div>

            <div class="cell path" style="grid-column:7;grid-row:2;"></div>
            <div class="cell path" style="grid-column:8;grid-row:2;"></div>
            <div class="cell path" style="grid-column:9;grid-row:2;"></div>

            <div class="cell path" style="grid-column:7;grid-row:3;"></div>
            <div class="cell path" style="grid-column:8;grid-row:3;"></div>
            <div class="cell path" style="grid-column:9;grid-row:3;"></div>

            <div class="cell path" style="grid-column:7;grid-row:4;"></div>
            <div class="cell path" style="grid-column:8;grid-row:4;"></div>
            <div class="cell path" style="grid-column:9;grid-row:4;"></div>

            <div class="cell path" style="grid-column:7;grid-row:5;"></div>
            <div class="cell path" style="grid-column:8;grid-row:5;"></div>
            <div class="cell path" style="grid-column:9;grid-row:5;"></div>

            <div class="cell path" style="grid-column:7;grid-row:6;"></div>
            <div class="cell path" style="grid-column:8;grid-row:6;"></div>
            <div class="cell path" style="grid-column:9;grid-row:6;"></div>


            <!-- CENTER -->
            <div class="center">

                <div class="center-core">
                    SAVARI
                </div>

            </div>


            <!-- LOWER PATH -->
            <div class="cell path" style="grid-column:7;grid-row:10;"></div>
            <div class="cell path" style="grid-column:8;grid-row:10;"></div>
            <div class="cell path" style="grid-column:9;grid-row:10;"></div>

            <div class="cell path" style="grid-column:7;grid-row:11;"></div>
            <div class="cell path" style="grid-column:8;grid-row:11;"></div>
            <div class="cell path" style="grid-column:9;grid-row:11;"></div>

            <div class="cell path" style="grid-column:7;grid-row:12;"></div>
            <div class="cell path" style="grid-column:8;grid-row:12;"></div>
            <div class="cell path" style="grid-column:9;grid-row:12;"></div>

            <div class="cell path" style="grid-column:7;grid-row:13;"></div>

            <div class="cell path" style="grid-column:7;grid-row:15;"></div>
            <div class="cell path" style="grid-column:8;grid-row:15;"></div>
            <div class="cell path" style="grid-column:9;grid-row:15;"></div>


            <!-- SIDE PATHS -->
            <div class="cell path" style="grid-column:1;grid-row:7;"></div>
            <div class="cell path" style="grid-column:2;grid-row:7;"></div>
            <div class="cell path" style="grid-column:3;grid-row:7;"></div>
            <div class="cell path" style="grid-column:4;grid-row:7;"></div>
            <div class="cell path" style="grid-column:5;grid-row:7;"></div>
            <div class="cell path" style="grid-column:6;grid-row:7;"></div>

            <div class="cell path" style="grid-column:1;grid-row:8;"></div>

            <div class="cell path" style="grid-column:5;grid-row:8;"></div>
            <div class="cell path" style="grid-column:6;grid-row:8;"></div>

            <div class="cell path" style="grid-column:1;grid-row:9;"></div>
            <div class="cell path" style="grid-column:2;grid-row:9;"></div>
            <div class="cell path" style="grid-column:3;grid-row:9;"></div>

    <!-- CONTROL -->

            🎮 Giliran:

        </div>

        <div id="dice" class="dice">

        <button

            class="roll"

        </button>

        <div id="status" class="status">
            Menunggu permainan...
        </div>

    </div>

</div>


<script type="module" src="./game.js"></script>

</body>
                </html>
