<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAVARI LUDO</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{
margin:0;
min-height:100vh;
background:radial-gradient(circle at top,#321052,#100719 55%,#050308);
color:#fff;
font-family:Arial,sans-serif;
}

.app{
width:min(100%,520px);
margin:auto;
padding:14px;
}

.logo{
text-align:center;
font-size:30px;
font-weight:900;
letter-spacing:5px;
color:#e879f9;
text-shadow:0 0 10px #e879f9,0 0 25px #a855f7;
}

.room{
text-align:center;
font-size:11px;
color:#c4b5fd;
margin:5px 0 12px;
}

.players{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:6px;
margin-bottom:12px;
}

.player{
padding:8px 3px;
border:1px solid #342043;
border-radius:12px;
background:#120a1c;
text-align:center;
font-size:10px;
transition:.2s;
}

.player.active{
border-color:#e879f9;
box-shadow:0 0 12px #a855f755;
}

.dot{
width:13px;
height:13px;
border-radius:50%;
margin:auto auto 5px;
box-shadow:0 0 10px currentColor;
}

.red{background:#ef4444;color:#ef4444}
.blue{background:#3b82f6;color:#3b82f6}
.green{background:#22c55e;color:#22c55e}
.yellow{background:#eab308;color:#eab308}

.board-wrap{
position:relative;
width:100%;
aspect-ratio:1;
padding:6px;
border:1px solid #a855f7;
border-radius:20px;
background:#160b22;
box-shadow:0 0 25px #a855f744;
}

.board{
position:relative;
width:100%;
height:100%;
display:grid;
grid-template-columns:repeat(15,1fr);
grid-template-rows:repeat(15,1fr);
overflow:hidden;
border-radius:15px;
background:#0c0712;
}

.home{
position:relative;
display:flex;
align-items:center;
justify-content:center;
}

.home.redHome{
grid-column:1/7;
grid-row:1/7;
background:#ef444422;
}

.home.blueHome{
grid-column:10/16;
grid-row:1/7;
background:#3b82f622;
}

.home.greenHome{
grid-column:1/7;
grid-row:10/16;
background:#22c55e22;
}

.home.yellowHome{
grid-column:10/16;
grid-row:10/16;
background:#eab30822;
}

.home-box{
width:70%;
height:70%;
border-radius:18px;
background:#09050e;
border:1px solid #ffffff22;
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
padding:14px;
}

.slot{
border-radius:50%;
border:2px solid #ffffff33;
}

.slot.red{background:#ef444455}
.slot.blue{background:#3b82f655}
.slot.green{background:#22c55e55}
.slot.yellow{background:#eab30855}

.cell{
border:1px solid #ffffff09;
background:#17101d;
}

.center{
grid-column:7/10;
grid-row:7/10;
background:conic-gradient(
#ef4444 0 25%,
#3b82f6 25% 50%,
#eab308 50% 75%,
#22c55e 75% 100%
);
display:flex;
align-items:center;
justify-content:center;
}

.center span{
width:48%;
height:48%;
border-radius:50%;
background:#100719;
border:2px solid #e879f9;
box-shadow:0 0 18px #e879f9;
display:flex;
align-items:center;
justify-content:center;
font-size:8px;
font-weight:900;
}

.piece{
position:absolute;
width:5.5%;
height:5.5%;
border-radius:50%;
border:2px solid #fff;
transform:translate(-50%,-50%);
z-index:20;
cursor:pointer;
box-shadow:0 0 8px currentColor,0 0 18px currentColor;
transition:left .25s,top .25s,transform .15s;
}

.piece:hover{
transform:translate(-50%,-50%) scale(1.2);
}

.piece.selectable{
animation:piecePulse .7s infinite alternate;
}

@keyframes piecePulse{
from{transform:translate(-50%,-50%) scale(1)}
to{transform:translate(-50%,-50%) scale(1.2)}
}

.control{
margin-top:12px;
padding:14px;
border:1px solid #39234d;
border-radius:18px;
background:#11091b;
text-align:center;
}

.turn{
font-size:12px;
color:#c4b5fd;
margin-bottom:10px;
}

.dice{
width:65px;
height:65px;
margin:auto auto 12px;
border-radius:15px;
background:#fff;
color:#12091a;
display:flex;
align-items:center;
justify-content:center;
font-size:32px;
font-weight:900;
box-shadow:0 0 18px #ffffff55;
}

.roll{
width:100%;
padding:13px;
border:0;
border-radius:13px;
background:linear-gradient(135deg,#8b5cf6,#e879f9);
color:#fff;
font-weight:900;
letter-spacing:2px;
font-size:14px;
}

.roll:disabled{
opacity:.35;
}

.status{
margin-top:10px;
font-size:11px;
color:#86efac;
}

.error{
color:#fca5a5;
}
</style>
</head>

<body>

<div class="app">

<div class="logo">SAVARI</div>

<div class="room">
MULTIPLAYER LUDO • ROOM
<strong id="roomId">---</strong>
</div>

<div class="players">

<div class="player active" id="playerCard0">
<div class="dot red"></div>
<div id="playerName0">Menunggu</div>
</div>

<div class="player" id="playerCard1">
<div class="dot blue"></div>
<div id="playerName1">Menunggu</div>
</div>

<div class="player" id="playerCard2">
<div class="dot green"></div>
<div id="playerName2">Menunggu</div>
</div>

<div class="player" id="playerCard3">
<div class="dot yellow"></div>
<div id="playerName3">Menunggu</div>
</div>

</div>

<div class="board-wrap">

<div class="board" id="board">

<div class="home redHome">
<div class="home-box">
<div class="slot red"></div>
<div class="slot red"></div>
<div class="slot red"></div>
<div class="slot red"></div>
</div>
</div>

<div class="home blueHome">
<div class="home-box">
<div class="slot blue"></div>
<div class="slot blue"></div>
<div class="slot blue"></div>
<div class="slot blue"></div>
</div>
</div>

<div class="home greenHome">
<div class="home-box">
<div class="slot green"></div>
<div class="slot green"></div>
<div class="slot green"></div>
<div class="slot green"></div>
</div>
</div>

<div class="home yellowHome">
<div class="home-box">
<div class="slot yellow"></div>
<div class="slot yellow"></div>
<div class="slot yellow"></div>
<div class="slot yellow"></div>
</div>
</div>

<div class="center">
<span>SAVARI</span>
</div>

<script>
const board=document.getElementById("board");

const blocked=new Set([
"1,1","2,1","3,1","4,1","5,1",
"1,2","2,2","3,2","4,2","5,2",
"1,3","2,3","3,3","4,3","5,3",
"1,4","2,4","3,4","4,4","5,4",
"1,5","2,5","3,5","4,5","5,5",
"10,1","11,1","12,1","13,1","14,1",
"10,2","11,2","12,2","13,2","14,2",
"10,3","11,3","12,3","13,3","14,3",
"10,4","11,4","12,4","13,4","14,4",
"10,5","11,5","12,5","13,5","14,5",
"1,10","2,10","3,10","4,10","5,10",
"1,11","2,11","3,11","4,11","5,11",
"1,12","2,12","3,12","4,12","5,12",
"1,13","2,13","3,13","4,13","5,13",
"1,14","2,14","3,14","4,14","5,14",
"10,10","11,10","12,10","13,10","14,10",
"10,11","11,11","12,11","13,11","14,11",
"10,12","11,12","12,12","13,12","14,12",
"10,13","11,13","12,13","13,13","14,13",
"10,14","11,14","12,14","13,14","14,14"
]);

for(let y=1;y<=15;y++){
for(let x=1;x<=15;x++){

if(
blocked.has(`${x},${y}`) ||
(x>=7&&x<=9&&y>=7&&y<=9)
) continue;

const cell=document.createElement("div");
cell.className="cell";
cell.style.gridColumn=x;
cell.style.gridRow=y;

board.appendChild(cell);
}
}
</script>

</div>
</div>

<div class="control">

<div class="turn">
🎮 Giliran:
<strong id="turnPlayer">Menunggu pemain</strong>
</div>

<div class="dice" id="dice">1</div>

<button class="roll" id="rollButton">
🎲 LEMPAR DADU
</button>

<div class="status" id="status">
Menghubungkan...
</div>

</div>

</div>

<script type="module" src="./game.js"></script>

</body>
</html>
